<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotlight on Reading 英文測驗系統</title>
  <style>
    :root {
      --primary-color: #4a90e2;
      --success-color: #2ecc71;
      --danger-color: #e74c3c;
      --bg-color: #f5f7fa;
      --card-bg: #ffffff;
    }

    body {
      font-family: "Segoe UI", Microsoft JhengHei, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 15px;
    }

    /* 冊別切換按鈕區樣式 (新加) */
    .book-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .book-btn {
      padding: 8px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: 2px solid var(--primary-color);
      background-color: white;
      color: var(--primary-color);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .book-btn.active {
      background-color: var(--primary-color);
      color: white;
    }

    /* 單元選擇器樣式 */
    .unit-selector-container {
      text-align: center;
      margin-bottom: 25px;
      background: #eef5fc;
      padding: 15px;
      border-radius: 8px;
    }

    .unit-selector-container label {
      font-weight: bold;
      font-size: 1.1rem;
      color: #2c3e50;
      margin-right: 10px;
    }

    select#unitSelect {
      padding: 8px 15px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid var(--primary-color);
      background-color: white;
      cursor: pointer;
    }

    .section-title {
      background: var(--primary-color);
      color: white;
      padding: 10px 15px;
      border-radius: 6px;
      margin-top: 30px;
      font-size: 1.2rem;
    }

    .q-card {
      border: 1px solid #e1e8ed;
      border-radius: 8px;
      padding: 15px;
      margin: 15px 0;
      background: #fafafa;
    }

    .q-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .audio-btn {
      background: #f39c12;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-left: 8px;
    }

    .audio-btn:hover { background: #d35400; }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
      margin-top: 8px;
    }

    .article-box {
      background: #eef5fc;
      border-left: 4px solid var(--primary-color);
      padding: 15px;
      border-radius: 4px;
      line-height: 1.6;
      font-size: 1.05rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .option-label {
      display: block;
      margin: 6px 0;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      background: var(--success-color);
      color: white;
      border: none;
      padding: 15px;
      font-size: 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 30px;
      font-weight: bold;
    }

    .submit-btn:hover { background: #27ae60; }

    /* 成果得分板 */
    .score-board {
      text-align: center;
      background: #fff8e7;
      border: 2px dashed #f39c12;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .score-number {
      font-size: 3rem;
      font-weight: bold;
      color: #e67e22;
      margin: 10px 0;
    }

    .feedback-msg {
      font-size: 1.5rem;
      font-weight: bold;
      margin-top: 10px;
    }

    .msg-fail { color: #e74c3c; }
    .msg-pass { color: #27ae60; }
    .msg-perfect { color: #e91e63; animation: pulse 1s infinite alternate; }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .result-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .correct { background: var(--success-color); }
    .wrong { background: var(--danger-color); }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1 id="unitTitle">Spotlight on Reading 英文測驗</h1>

  <!-- 雙層選單區塊：冊別 + 課別 -->
  <div class="unit-selector-container">
    <!-- 1. 冊別頁籤 (Book 1 / Book 2) -->
    <div class="book-tabs">
      <button type="button" class="book-btn active" id="btnBook1" onclick="switchBook(1)">Book 1</button>
      <button type="button" class="book-btn" id="btnBook2" onclick="switchBook(2)">Book 2</button>
    </div>

    <!-- 2. 課別選擇選單 -->
    <label for="unitSelect">📖 請選擇測驗單元：</label>
    <select id="unitSelect" onchange="switchUnit(this.value)">
      <option value="1">Unit 1</option>
      <option value="2">Unit 2</option>
      <option value="3">Unit 3</option>
      <option value="4">Unit 4</option>
      <option value="5">Unit 5</option>
      <option value="6">Unit 6</option>
      <option value="7">Unit 7</option>
      <option value="8">Unit 8</option>
      <option value="9">Unit 9</option>
      <option value="10">Unit 10</option>
      <option value="11">Unit 11</option>
      <option value="12">Unit 12</option>
      <option value="13">Unit 13</option>
      <option value="14">Unit 14</option>
      <option value="15">Unit 15</option>
      <option value="16">Unit 16</option>
    </select>
  </div>

  <form id="quizForm">
    <!-- 單字與句型區 -->
    <div id="wordsSentencesArea"></div>

    <!-- 克漏字區 -->
    <div id="clozeArea" class="hidden">
      <div class="section-title">三、克漏字測驗 (Cloze Test)</div>
      <div id="clozeArticle" class="article-box"></div>
      <div id="clozeQuestions"></div>
    </div>

    <!-- 短篇閱讀區 -->
    <div id="readingArea" class="hidden">
      <div class="section-title">四、短篇閱讀理解 (Reading Comprehension)</div>
      <div id="readingArticle" class="article-box"></div>
      <div id="readingQuestions"></div>
    </div>

    <button type="submit" class="submit-btn">完成並送出批改 🚀</button>
  </form>

  <!-- 批改結果頁面 -->
  <div id="resultArea" class="hidden">
    <div class="score-board">
      <h2>測驗成果結果</h2>
      <div id="scoreText" class="score-number">100 分</div>
      <div id="feedbackText" class="feedback-msg"></div>
    </div>
    <div id="reviewList"></div>
    <button onclick="location.reload()" class="submit-btn" style="background:#3498db;">再測驗一次 🔄</button>
  </div>
</div>

<script>
  // 當前選擇的冊別 (預設 Book 1)
  let currentBook = 1;

  // 切換冊別 (Book 1 / Book 2)
  function switchBook(bookNum) {
    currentBook = bookNum;
    
    // 更新按鈕樣式
    document.getElementById("btnBook1").classList.toggle("active", bookNum === 1);
    document.getElementById("btnBook2").classList.toggle("active", bookNum === 2);

    // 重新載入當前下拉選單所選的 Unit 題目
    const currentUnit = document.getElementById("unitSelect").value;
    switchUnit(currentUnit);
  }

  // 發音功能
  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  }

  // 動態切換單元 JS 檔
  function switchUnit(unitNum) {
    // 清空目前畫面與重新顯示表單
    document.getElementById("quizForm").classList.remove("hidden");
    document.getElementById("resultArea").classList.add("hidden");
    document.getElementById("wordsSentencesArea").innerHTML = "";
    document.getElementById("clozeQuestions").innerHTML = "";
    document.getElementById("readingQuestions").innerHTML = "";
    document.getElementById("clozeArea").classList.add("hidden");
    document.getElementById("readingArea").classList.add("hidden");

    // 移除舊腳本
    const oldScript = document.getElementById("dynamicUnitScript");
    if (oldScript) oldScript.remove();

    // 載入新腳本 (自動判定 spotlight1 或 spotlight2 資料夾)
    const script = document.createElement("script");
    script.id = "dynamicUnitScript";
    script.src = `data/spotlight${currentBook}/unit${unitNum}.js`;
    
    script.onload = () => {
      renderQuiz();
    };
    script.onerror = () => {
      alert(`Book ${currentBook} Unit ${unitNum} 的題庫檔 (data/spotlight${currentBook}/unit${unitNum}.js) 還沒建立喔！`);
    };
    document.body.appendChild(script);
  }

  // 渲染測驗題目
  function renderQuiz() {
    if (!window.unitData) return;
    document.getElementById("unitTitle").innerText = window.unitData.unit;
    const wsArea = document.getElementById("wordsSentencesArea");

    let currentSection = "";
    const allQuestions = [...(window.unitData.words || []), ...(window.unitData.sentences || [])];

    allQuestions.forEach((q, idx) => {
      let secName = "";
      if (q.type === "chinese_to_english") secName = "一、單字 - 中翻英 (無提示)";
      else if (q.type === "context_fill") secName = "二、單字 - 文意填空 (開頭字母提示)";
      else if (["q_and_a", "unscramble", "rewrite"].includes(q.type)) secName = "三、句型練習 (問答/重組/改寫)";

      if (secName !== currentSection) {
        currentSection = secName;
        const titleDiv = document.createElement("div");
        titleDiv.className = "section-title";
        titleDiv.innerText = secName;
        wsArea.appendChild(titleDiv);
      }

      const card = document.createElement("div");
      card.className = "q-card";
      card.innerHTML = `
        <div class="q-title">
          Q${idx + 1}. ${q.prompt}
          <button type="button" class="audio-btn" onclick="speakText('${q.answer[0].replace(/'/g, "\\'")}')">🔊 聽發音</button>
        </div>
        <input type="text" name="ws_${q.id}" autocomplete="off" placeholder="請在此輸入答案...">
      `;
      wsArea.appendChild(card);
    });

    // 渲染克漏字
    if (window.unitData.cloze) {
      document.getElementById("clozeArea").classList.remove("hidden");
      document.getElementById("clozeArticle").innerText = window.unitData.cloze.article;
      const cQArea = document.getElementById("clozeQuestions");
      window.unitData.cloze.questions.forEach(q => {
        const div = document.createElement("div");
        div.className = "q-card";
        let optionsHTML = q.options.map(opt => `
          <label class="option-label">
            <input type="radio" name="cloze_${q.id}" value="${opt}"> ${opt}
          </label>
        `).join('');
        div.innerHTML = `<div class="q-title">${q.number} 題：</div>` + optionsHTML;
        cQArea.appendChild(div);
      });
    }

    // 渲染閱讀理解
    if (window.unitData.reading) {
      document.getElementById("readingArea").classList.remove("hidden");
      document.getElementById("readingArticle").innerText = window.unitData.reading.article;
      const rQArea = document.getElementById("readingQuestions");
      window.unitData.reading.questions.forEach(q => {
        const div = document.createElement("div");
        div.className = "q-card";
        let optionsHTML = q.options.map(opt => `
          <label class="option-label">
            <input type="radio" name="reading_${q.id}" value="${opt}"> ${opt}
          </label>
        `).join('');
        div.innerHTML = `<div class="q-title">${q.prompt}</div>` + optionsHTML;
        rQArea.appendChild(div);
      });
    }
  }

  // 初始化預設載入 Book 1 Unit 1
  document.addEventListener("DOMContentLoaded", () => {
    switchUnit(1);
  });

  // 表單對答案與計分邏輯
  document.getElementById("quizForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    let wrongCount = 0;
    const reviewList = document.getElementById("reviewList");
    reviewList.innerHTML = "";

    // 1. 批改單字與句型
    const allWS = [...(window.unitData.words || []), ...(window.unitData.sentences || [])];
    allWS.forEach((q, idx) => {
      const uAns = (formData.get(`ws_${q.id}`) || '').trim();
      const isCorrect = q.answer.some(a => {
        const target = String(a).trim();
        const hasCapital = /[A-Z]/.test(target);
        return hasCapital ? target === uAns : target.toLowerCase() === uAns.toLowerCase();
      });

      if (!isCorrect) wrongCount++;

      const item = document.createElement("div");
      item.className = "q-card";
      item.innerHTML = `
        <div>
          <span class="result-badge ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? '✓ 正確' : '✕ 錯誤'}</span>
          <strong>Q${idx + 1}. ${q.prompt}</strong>
        </div>
        <div style="margin-top: 8px;">
          學生回答：<span style="color:${isCorrect ? 'green' : 'red'};">${uAns || '(未作答)'}</span><br>
          正確答案：<strong>${q.answer[0]}</strong>
          <button type="button" class="audio-btn" onclick="speakText('${q.answer[0].replace(/'/g, "\\'")}')">🔊 聽發音</button>
        </div>
      `;
      reviewList.appendChild(item);
    });

    // 2. 批改克漏字
    if (window.unitData.cloze) {
      window.unitData.cloze.questions.forEach(q => {
        const uAns = formData.get(`cloze_${q.id}`) || '';
        const isCorrect = q.answer.includes(uAns);
        if (!isCorrect) wrongCount++;

        const item = document.createElement("div");
        item.className = "q-card";
        item.innerHTML = `
          <div>
            <span class="result-badge ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? '✓ 正確' : '✕ 錯誤'}</span>
            <strong>克漏字 ${q.number} 題</strong>
          </div>
          <div style="margin-top: 8px;">
            學生回答：${uAns || '(未作答)'} | 正確答案：<strong>${q.answer[0]}</strong>
          </div>
        `;
        reviewList.appendChild(item);
      });
    }

    // 3. 批改閱讀測驗
    if (window.unitData.reading) {
      window.unitData.reading.questions.forEach(q => {
        const uAns = formData.get(`reading_${q.id}`) || '';
        const isCorrect = q.answer.includes(uAns);
        if (!isCorrect) wrongCount++;

        const item = document.createElement("div");
        item.className = "q-card";
        item.innerHTML = `
          <div>
            <span class="result-badge ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? '✓ 正確' : '✕ 錯誤'}</span>
            <strong>${q.prompt}</strong>
          </div>
          <div style="margin-top: 8px;">
            學生回答：${uAns || '(未作答)'} | 正確答案：<strong>${q.answer[0]}</strong>
          </div>
        `;
        reviewList.appendChild(item);
      });
    }

    // 4. 計算得分 (錯一題扣 2 分)
    let finalScore = 100 - (wrongCount * 2);
    if (finalScore < 0) finalScore = 0; // 最低分數限制為 0 分

    // 5. 評語與結果顯示邏輯
    const feedbackText = document.getElementById("feedbackText");
    if (finalScore === 100) {
      feedbackText.className = "feedback-msg msg-perfect";
      feedbackText.innerHTML = "💖 Nicole老師愛你喔！太優秀了！完美 100 分！ 💖";
    } else if (finalScore >= 90) {
      feedbackText.className = "feedback-msg msg-pass";
      feedbackText.innerHTML = "🎉 恭喜你過關！表現得非常棒喔！ 🎉";
    } else {
      feedbackText.className = "feedback-msg msg-fail";
      feedbackText.innerHTML = "🥺 很抱歉沒通過，請再練習一次喔！加油！ 💪";
    }

    document.getElementById("quizForm").classList.add("hidden");
    document.getElementById("resultArea").classList.remove("hidden");
    document.getElementById("scoreText").innerText = `${finalScore} 分`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>

</body>
</html>
